<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<link rel="icon" href="imagens/favicon.png">
		<link rel="stylesheet" href="style2.css">
		<title>Adicionar Livro</title>
	</head>
	<body>
		<h1>Adicionar Livro a Biblioteca</h1>
		<form name="frmLivro" action="insert">
			<table>
				<tr> 
					<td><input type="text" name="titulo" placeholder="Título" class="caixa1"></td>
				</tr>
				<tr>
					<td><input type="text" name="autor" placeholder="Autor" class="caixa1"></td> 
				</tr>	
				<tr> 
					<td><input type="text" name="ano_Publicacao" placeholder="Ano da Publicação" class="caixa2"></td>
				</tr>
				<tr> 
					<td><input type="text" name="ISBN" placeholder="ISBN" class="caixa2"></td>
				</tr>
			</table>
			<input type="button" value="Adicionar" class="botao1" onclick="validar()">
		</form>
		<script src="scripts/validador.js"></script>
	</body>
</html>
